[tools]
bun = "latest"
go = "latest"
node = "26.10.0"
python = "3.14"
ruby = "latest"
rust = "latest"
terraform = "latest"
uv = "latest"

[settings]
experimental = true
minimum_release_age = "12h"
idiomatic_version_file_enable_tools = ["ruby", "bun", "node", "python"]

[settings.ruby]
compile = false

[settings.python]
compile = false

[shell_alias]
bcp = "brew cleanup --prune=all"
ber = "bundle exec rspec"
bera = "bundle exec rubocop -A"
berd = "bundle exec rubocop -D"
berdd = "git ls-files -z -m --others --exclude-standard -- '*.rb' | xargs -0 bundle exec rubocop -D"
berm = "git ls-files -z --modified --others --exclude-standard -- ':(glob)spec/**/*_spec.rb' | xargs -0 -o bundle exec rspec"
beru = "git ls-files -z -m --others --exclude-standard -- '*.rb' | xargs -0 bundle exec rubocop -A"
c = "cursor ."
cco = "code ."
clear_swap = "rm -rf ~/.local/state/nvim/swap/*.*"
cls = "clear"
dc = "docker-compose"
ducks = "find . -maxdepth 1 -not -name '.' -print0 | xargs -0 du -ckhs | sort -hr"
flushdns = "sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder"
gbb = "git branch | grep -v '^\\*' | fzf --height=20% --reverse --info=inline | xargs git checkout"
gcupdate = "git commit -am '(chore) updates'"
gdd = "git branch | grep -v '^\\*' | fzf --height=20% --reverse --info=inline | xargs git branch -D"
gg = "lazygit"
kd = "kamal deploy"
merge_main = "git fetch origin && git merge origin/main"
merge_master = "git fetch origin && git merge origin/master"
ml = "mise lint"
mt = "mise test"
oc = "overmind c"
okta = "bw get password okta | pbcopy"
rails_new = "gem exec nextgen create"
rebase_main = "git fetch origin && git rebase origin/main"
rebase_master = "git fetch origin && git rebase origin/master"
reboot_network = "sudo ifconfig en0 down && sleep 5 && sudo ifconfig en0 up; flushdns"
sp = "spotify_player"
t = "bundle exec rake test"
tg = "topgrade"
