[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.oh-my-zsh/custom/plugins/zsh-autocomplete" = { url = "https://github.com/marlonrichert/zsh-autocomplete.git" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.oh-my-zsh/custom/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab" }

[dotfiles]
"~/.aliases" = "dotfiles/zsh/aliases"
"~/.functions" = "dotfiles/zsh/functions"
"~/.gemrc" = "dotfiles/ruby/gemrc"
"~/.gitconfig" = "dotfiles/git/config"
"~/.gitignore.global" = "dotfiles/git/ignore"
"~/.yamlfmt" = "dotfiles/yaml/yamlfmt"
"~/.zshrc" = "dotfiles/zsh/zshrc"
"~/.config/starship.toml" = "dotfiles/starship/config.toml"
"~/.config/topgrade.toml" = "dotfiles/topgrade/config.toml"
"~/.config/tmux" = { source = "dotfiles/tmux", mode = "symlink-each" }
"~/.config/zellij" = { source = "dotfiles/zellij", mode = "symlink-each" }
"~/.config/nvim" = { source = "dotfiles/nvim", mode = "symlink-each" }
"~/.config/ghostty" = { source = "dotfiles/ghostty", mode = "symlink-each" }
"~/.config/lazygit" = { source = "dotfiles/lazygit", mode = "symlink-each" }
"~/.config/opencode/opencode.json" = "dotfiles/opencode/config.json"
"~/.config/atuin" = { source = "dotfiles/atuin", mode = "symlink-each" }
"~/.cursor/mcp.json" = "dotfiles/cursor/mcp.json"
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "copy" }

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.finder]
show_extensions_warning = false
show_pathbar = true
show_status_bar = true

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.macos.defaults.NSGlobalDomain]
CGFontRenderingFontSmoothingDisabled = true
"com.apple.swipescrolldirection" = false
AppleLocale = "en_DE@currency=EUR"
AppleMeasurementUnits = "Centimeters"
AppleMetricUnits = true
NSAutomaticPeriodSubstitutionEnabled = false

[bootstrap.macos.defaults."com.apple.BluetoothAudioAgent"]
"Apple Bitpool Min (editable)" = 80
"Apple Bitpool Max (editable)" = 80
"Apple Initial Bitpool (editable)" = "80"
"Apple Initial Bitpool Min (editable)" = "80"
"Negotiated Bitpool" = "80"
"Negotiated Bitpool Max" = "80"
"Negotiated Bitpool Min" = "80"

[bootstrap.macos.defaults."com.apple.HIToolbox"]
AppleFnUsageType = 0

[bootstrap.macos.defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.finder"]
_FXEnableColumnAutoSizing = true

[bootstrap.macos.defaults."com.apple.dock"]
expose-group-apps = true

[tasks.bootstrap]
run = "scripts/mac"

[tasks.ssh]
run = "scripts/install_ssh_keys"

[tasks.bulb]
run = "scripts/build_bulb.sh"
